<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ChatGPT Avatar Overlay Settings</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main class="settings">
      <h1>Avatar settings</h1>
      <p class="intro">Choose an avatar for the ChatGPT overlay. Images are stored locally in this Chrome profile.</p>

      <div class="preview-frame">
        <img id="avatar-preview" alt="Avatar preview">
      </div>

      <label class="file-label" for="avatar-file">Choose image</label>
      <input id="avatar-file" type="file" accept="image/png,image/jpeg,image/webp">
      <p class="hint">PNG, JPEG, or WebP. Maximum file size: 5 MB.</p>

      <div class="actions">
        <button id="save-avatar" type="button">Save avatar</button>
        <button id="reset-avatar" type="button" class="secondary">Use default</button>
      </div>

      <p id="status" class="status" role="status" aria-live="polite"></p>
    </main>
    <script src="options.js"></script>
  </body>
</html>
