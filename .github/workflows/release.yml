name: Release extension

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4

      - name: Package and validate extension
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bash scripts/package.sh "$VERSION"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"
          gh release create "$TAG" "dist/now-you-see-me-$VERSION.zip" \
            --title "$TAG" \
            --generate-notes
